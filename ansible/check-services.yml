---
- name: Verify Jenkins and Docker Services
  hosts: local
  become: true

  tasks:
    - name: Ensure Jenkins is active and enabled
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: true

    - name: Ensure Docker is active and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
